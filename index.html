<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Psss 🤫</title><link rel="stylesheet" href="style.css"></head><body>
<section id="auth"><h1>Psss 🤫</h1><button onclick="show('login')">Anmelden</button><button onclick="show('register')">Registrieren</button>
<form id="login"><input id="lu" placeholder="Benutzername" required><input id="lp" type="password" placeholder="PIN" required><button>Anmelden</button></form>
<form id="register" class="hidden"><input id="dn" placeholder="Dein Name" required><input id="ru" placeholder="Benutzername" required><input id="rp" type="password" placeholder="PIN" required><input id="ic" value="PSSS-2026" required><button>Registrieren</button></form><p id="msg"></p></section>
<section id="app" class="hidden"><header><b>Psss 🤫</b><span id="me"></span><button id="logout">Abmelden</button></header><div class="layout"><aside><div class="tools"><button id="friendBtn">+ Freund</button><button id="groupBtn">+ Gruppe</button></div><div id="list"></div></aside><main><div id="empty">Chat auswählen</div><div id="panel" class="hidden"><h2 id="title"></h2><small id="meta"></small><div id="messages"></div><form id="send"><input id="text" placeholder="Nachricht schreiben …"><button>➤</button></form></div></main></div></section>
<dialog id="friendDlg"><form method="dialog"><input id="friendName" placeholder="Name"><button id="saveFriend">Hinzufügen</button></form></dialog>
<dialog id="groupDlg"><form method="dialog"><input id="groupName" placeholder="Gruppenname"><input id="members" placeholder="Mitglieder: Steffi, Martin"><button id="saveGroup">Gruppe erstellen</button></form></dialog>
<script src="app.js"></script></body></html>
